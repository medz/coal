name: Tab Script Runtime

on:
  pull_request:
    branches:
      - main
    paths:
      - lib/src/tab/**
      - test/tab/**
      - .github/workflows/tab-script-runtime.yml
  push:
    branches:
      - main
    paths:
      - lib/src/tab/**
      - test/tab/**
      - .github/workflows/tab-script-runtime.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    name: runtime (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            required_shells: bash,zsh,fish,pwsh
          - os: macos-latest
            required_shells: bash,zsh
          - os: windows-latest
            required_shells: pwsh
    env:
      COAL_REQUIRED_SHELLS: ${{ matrix.required_shells }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Install Shell Dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh fish

      - name: Install Dependencies
        run: dart pub get

      - name: Run Script Runtime Tests
        run: dart test --tags=script-runtime
